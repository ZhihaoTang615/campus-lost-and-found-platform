{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-messages" role="status" aria-live="polite">
  <ul>
    {% for category, message in messages %}
    <li class="flash-message flash-message-{{ category }}">{{ message }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
{% endwith %}
